<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PicTune 現状と3案</title><link rel="stylesheet" href="assets/device.css"><style>body{display:block;padding:40px;background:#E8EBE6;color:#28342D;font-family:var(--sf)}h1{font-size:28px;margin:0 0 12px;letter-spacing:-.8px}p{font-size:13px;margin:0;color:#59665D}main{display:flex;gap:28px;margin-top:32px;flex-wrap:wrap}.entry{width:402px}h2{font-size:17px;margin:0 0 16px}.screen img{width:100%;height:100%;display:block;object-fit:cover}.entry p{margin-top:16px;line-height:1.6}</style></head>
<body><h1>PicTune · 現状とメイン画面3案</h1><p>現状は既存シミュレーター画像。A〜Cは実装前のHTMLモックアップです。</p><main>

<div class="entry"><h2>B · 音のギャラリー</h2><section class="screen" data-name="after-b" data-chrome="none"><img src="shots/r2/02-b-sound-gallery.png" alt="B 音のギャラリー"></section><p>写真と曲を一組のジャケットとして見る体験。</p></div>
