<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>思い出の贈りもの — PicTune</title>
<style>a[hidden]{display:none}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(at 20% 20%,#e6d5fb,transparent 65%),radial-gradient(at 90% 70%,#fbddea,transparent 60%),#faf6fc;color:#392b53;font-family:system-ui,sans-serif}main{max-width:420px;text-align:center;padding:36px 24px}.brand{font-size:12px;letter-spacing:.3em}.gift{font-size:90px;margin:36px}h1{font-family:serif;font-size:32px;line-height:1.5}p{font-size:15px;line-height:1.9}a,button{display:block;background:#8660ba;color:white;text-decoration:none;padding:17px;border-radius:32px;margin:26px auto;border:0;font-size:16px;font-weight:600}small{display:block;line-height:1.8;color:#70627d}#invalid{display:none}</style></head><body><main><div class="brand">✧ PICTUNE / FOR YOU</div><div class="gift" aria-hidden="true">💌</div><h1>あなたへ、<br>思い出の贈りもの。</h1><p>写真と音楽、伝えたい気持ちを込めて。<br>PicTuneでログインして受け取ってください。</p><a id="open" hidden>PicTuneで開く</a><p id="invalid">招待リンクの形式が正しくありません。</p><small>アプリが開かない場合は、最新のPicTuneをインストールしてから、届いたリンクをもう一度開いてください。<br>このページには、写真や手紙は表示されません。</small></main><script>
const match=location.pathname.match(/^\/invite\/([a-f0-9]{64})$/);const button=document.getElementById('open');if(match&&!location.search&&!location.hash){button.href='pictune://invite/'+match[1];button.hidden=false;}else{document.getElementById('invalid').style.display='block';button.remove();}
</script></body></html>
